<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="indigoGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" rx="16" fill="url(#bgGrad)" />
  <rect x="1" y="1" width="798" height="498" rx="15" stroke="#312e81" stroke-width="1.5" stroke-opacity="0.6" />

  <!-- Grid overlay -->
  <g opacity="0.12" stroke="#6366f1" stroke-width="1">
    <line x1="0" y1="100" x2="800" y2="100" stroke-dasharray="4 6" />
    <line x1="0" y1="200" x2="800" y2="200" stroke-dasharray="4 6" />
    <line x1="0" y1="300" x2="800" y2="300" stroke-dasharray="4 6" />
    <line x1="0" y1="400" x2="800" y2="400" stroke-dasharray="4 6" />
    <line x1="160" y1="0" x2="160" y2="500" stroke-dasharray="4 6" />
    <line x1="320" y1="0" x2="320" y2="500" stroke-dasharray="4 6" />
    <line x1="480" y1="0" x2="480" y2="500" stroke-dasharray="4 6" />
    <line x1="640" y1="0" x2="640" y2="500" stroke-dasharray="4 6" />
  </g>

  <!-- Title Pill -->
  <rect x="40" y="36" width="220" height="32" rx="16" fill="#1e1b4b" stroke="#4f46e5" stroke-width="1" />
  <circle cx="56" cy="52" r="5" fill="#10b981" />
  <text x="70" y="57" fill="#e0e7ff" font-family="system-ui, sans-serif" font-size="12" font-weight="600" letter-spacing="0.5">n8n AUTOMATION FLOW</text>

  <!-- Connecting Lines -->
  <path d="M 180 250 L 260 250" stroke="#6366f1" stroke-width="3" stroke-dasharray="6 4" />
  <path d="M 380 250 L 460 250" stroke="#6366f1" stroke-width="3" stroke-dasharray="6 4" />
  <path d="M 580 250 L 660 250" stroke="#10b981" stroke-width="3" />

  <!-- Step 1 Node -->
  <g transform="translate(60, 190)">
    <rect width="120" height="120" rx="16" fill="#111827" stroke="#374151" stroke-width="1.5" />
    <circle cx="60" cy="46" r="22" fill="#1e293b" />
    <path d="M52 46 L68 46 M60 38 L68 46 L60 54" stroke="#818cf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <text x="60" y="86" fill="#f3f4f6" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Webhook</text>
    <text x="60" y="102" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Inbound Lead</text>
  </g>

  <!-- Step 2 Node: AI Agent -->
  <g transform="translate(260, 175)">
    <rect width="130" height="150" rx="18" fill="#1e1b4b" stroke="#6366f1" stroke-width="2" filter="url(#glow)" />
    <rect width="130" height="150" rx="18" fill="#1e1b4b" />
    <circle cx="65" cy="50" r="26" fill="#312e81" stroke="#818cf8" stroke-width="1.5" />
    <text x="65" y="56" fill="#e0e7ff" font-family="system-ui, sans-serif" font-size="18" text-anchor="middle">⚡</text>
    <text x="65" y="98" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">AI Classifier</text>
    <text x="65" y="116" fill="#a5b4fc" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">OpenAI GPT-4o</text>
    <rect x="25" y="128" width="80" height="14" rx="7" fill="#4338ca" />
    <text x="65" y="139" fill="#e0e7ff" font-family="system-ui, sans-serif" font-size="8.5" font-weight="600" text-anchor="middle">ICP Scoring</text>
  </g>

  <!-- Step 3 Node: HubSpot Upsert -->
  <g transform="translate(460, 190)">
    <rect width="120" height="120" rx="16" fill="#111827" stroke="#374151" stroke-width="1.5" />
    <circle cx="60" cy="46" r="22" fill="#1e293b" />
    <path d="M52 46 H68 M60 38 V54" stroke="#f97316" stroke-width="2.5" stroke-linecap="round" />
    <text x="60" y="86" fill="#f3f4f6" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">CRM Upsert</text>
    <text x="60" y="102" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">HubSpot Sync</text>
  </g>

  <!-- Step 4 Node: Real-time Alert -->
  <g transform="translate(640, 190)">
    <rect width="120" height="120" rx="16" fill="#064e3b" stroke="#10b981" stroke-width="2" />
    <circle cx="60" cy="46" r="22" fill="#065f46" />
    <path d="M52 48 L58 54 L70 42" stroke="#34d399" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <text x="60" y="86" fill="#ecfdf5" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Slack Alert</text>
    <text x="60" y="102" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">&lt;3 Min SLA</text>
  </g>

  <!-- Bottom Metric Banner -->
  <rect x="180" y="415" width="440" height="50" rx="25" fill="#111827" stroke="#374151" stroke-width="1" />
  <circle cx="210" cy="440" r="10" fill="#10b981" fill-opacity="0.2" />
  <circle cx="210" cy="440" r="4" fill="#10b981" />
  <text x="235" y="445" fill="#f3f4f6" font-family="system-ui, sans-serif" font-size="13" font-weight="600">ROI Metric: <tspan fill="#34d399">18+ hours saved / week</tspan> per SDR rep</text>
</svg>
