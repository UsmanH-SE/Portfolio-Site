<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="agentBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="60%" stop-color="#141829" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="purpleGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" rx="16" fill="url(#agentBg)" />
  <rect x="1" y="1" width="798" height="498" rx="15" stroke="#312e81" stroke-width="1.5" />

  <!-- Chat container window -->
  <rect x="50" y="35" width="700" height="430" rx="14" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />
  
  <!-- Header bar -->
  <rect x="50" y="35" width="700" height="56" rx="14" fill="#1e293b" />
  <rect x="50" y="70" width="700" height="21" fill="#1e293b" />
  <circle cx="80" cy="63" r="14" fill="#6366f1" />
  <text x="80" y="68" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" text-anchor="middle">⚡</text>
  <text x="106" y="58" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Autonomous Support Agent (Claude 3.5 Sonnet)</text>
  <circle cx="109" cy="72" r="3.5" fill="#10b981" />
  <text x="118" y="76" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">RAG Embeddings Active • SLA &lt; 45s • Live in Zendesk</text>

  <rect x="580" y="50" width="140" height="26" rx="13" fill="#065f46" stroke="#10b981" stroke-width="1" />
  <text x="650" y="67" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">42% Autonomous Resolves</text>

  <!-- User Message 1 -->
  <rect x="360" y="115" width="360" height="60" rx="12" fill="#312e81" stroke="#4f46e5" stroke-width="1" />
  <text x="380" y="140" fill="#e0e7ff" font-family="system-ui, sans-serif" font-size="12">"Can we upgrade our tier mid-cycle, and how</text>
  <text x="380" y="158" fill="#e0e7ff" font-family="system-ui, sans-serif" font-size="12">does prorated billing apply to active seats?"</text>

  <!-- AI Agent Response 1 -->
  <rect x="80" y="195" width="460" height="105" rx="12" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5" />
  <rect x="96" y="210" width="130" height="20" rx="4" fill="#4338ca" />
  <text x="161" y="224" fill="#c7d2fe" font-family="system-ui, sans-serif" font-size="10" font-weight="600" text-anchor="middle">DOCS EMBEDDING RETRIEVED</text>
  <text x="96" y="248" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="500">Yes! Mid-cycle plan upgrades are applied instantly.</text>
  <text x="96" y="268" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11.5">Unused days from your current tier are credited automatically,</text>
  <text x="96" y="286" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11.5">and additional seats sync right away to your billing dashboard.</text>

  <!-- Autonomous Action Box -->
  <g transform="translate(80, 320)">
    <rect width="640" height="110" rx="10" fill="#090d16" stroke="#334155" stroke-width="1" />
    <text x="24" y="32" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" font-weight="600">AGENT TOOL CALL TRACE:</text>
    
    <rect x="24" y="48" width="180" height="42" rx="6" fill="#1e293b" />
    <text x="36" y="66" fill="#a5b4fc" font-family="monospace" font-size="11">verify_account(id)</text>
    <text x="36" y="82" fill="#34d399" font-family="monospace" font-size="10">✓ Verified: Pro Org</text>

    <rect x="220" y="48" width="200" height="42" rx="6" fill="#1e293b" />
    <text x="232" y="66" fill="#a5b4fc" font-family="monospace" font-size="11">calc_prorated_diff()</text>
    <text x="232" y="82" fill="#34d399" font-family="monospace" font-size="10">✓ Computed: $42.50 delta</text>

    <rect x="436" y="48" width="180" height="42" rx="6" fill="#1e293b" />
    <text x="448" y="66" fill="#a5b4fc" font-family="monospace" font-size="11">post_zendesk_status()</text>
    <text x="448" y="82" fill="#34d399" font-family="monospace" font-size="10">✓ Resolved in 28s</text>
  </g>
</svg>
