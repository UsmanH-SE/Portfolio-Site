  <text x="390" y="362" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Hub C (Central)</text>
  <text x="500" y="362" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="12" font-weight="600">8,950</text>
  <rect x="626" y="348" width="70" height="20" rx="10" fill="#065f46" />
  <text x="661" y="362" fill="#34d399" font-family="system-ui, sans-serif" font-size="10" font-weight="600" text-anchor="middle">HEALTHY</text>

  <rect x="244" y="398" width="180" height="28" rx="6" fill="#3b82f6" />
  <text x="334" y="416" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">+ New Batch Dispatch</text>
